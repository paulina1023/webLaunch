name: Deploy Website

on:
  push:
    branches:
      - paulina

# Concede los permisos necesarios para que GitHub Actions publique en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue a la vez para evitar colisiones
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
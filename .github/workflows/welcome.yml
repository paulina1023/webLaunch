name: Welcome Notifier

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Crear comentario de bienvenida
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `¡Hola @${context.actor}! 👋 Gracias por abrir esta issue en **WebLaunch**. El equipo la revisará pronto.`
            })
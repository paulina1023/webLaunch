name: Bot de Bienvenida

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Saludar al colaborador
        uses: actions/github-script@v7
        with:
          script: |
            const isIssue = !!context.payload.issue;
            const user = context.actor;
            const body = isIssue 
              ? `¡Hola @${user}! 👋 Gracias por abrir esta issue en WebLaunch.`
              : `¡Hola @${user}! 🚀 Gracias por tu contribución en WebLaunch.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
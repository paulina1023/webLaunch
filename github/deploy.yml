name: Deploy Website and Extra CI

on:
  push:
    branches:
      - paulina
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-required-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar archivos esenciales
        run: |
          test -f index.html
          echo "El archivo index.html existe"
          if [ -f README.md ]; then
            echo "El archivo README.md existe"
          else
            echo "README.md no existe, pero no es obligatorio para el despliegue"
          fi

  validate-html:
    runs-on: ubuntu-latest
    needs: check-required-files
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar HTMLHint
        run: npm install --save-dev htmlhint

      - name: Validar HTML
        run: npx htmlhint index.html

  validate-css:
    runs-on: ubuntu-latest
    needs: check-required-files
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Comprobar si existen archivos CSS
        id: csscheck
        run: |
          if find . -name "*.css" | grep -q .; then
            echo "css_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "css_found=false" >> "$GITHUB_OUTPUT"
            echo "No hay archivos CSS en el proyecto"
          fi

      - name: Configurar Node.js
        if: steps.csscheck.outputs.css_found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Stylelint
        if: steps.csscheck.outputs.css_found == 'true'
        run: npm install --save-dev stylelint stylelint-config-standard

      - name: Ejecutar Stylelint
        if: steps.csscheck.outputs.css_found == 'true'
        run: npx stylelint "**/*.css"

  validate-links:
    runs-on: ubuntu-latest
    needs: check-required-files
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar enlaces locales del sitio
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          try:
              with open('index.html', 'r', encoding='utf-8') as f:
                  html = f.read()
          except FileNotFoundError:
              print('No se encontró index.html')
              sys.exit(1)

          refs = re.findall(r'''(?:href|src)=["']([^"']+)["']''', html, flags=re.IGNORECASE)
          missing = []

          for ref in refs:
              if ref.startswith(('http://', 'https://', 'mailto:', '#', 'javascript:')):
                  continue

              target = ref.split('?')[0].split('#')[0]
              if not target or target == '/':
                  continue

              if not os.path.exists(target):
                  missing.append(target)

          if missing:
              print('Enlaces locales faltantes:')
              for item in missing:
                  print(' -', item)
              sys.exit(1)

          print('Todos los enlaces locales dentro del sitio existen')
          PY

  deploy:
    needs: [check-required-files, validate-html, validate-css, validate-links]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

